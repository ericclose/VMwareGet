name: Build & Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: 'VMwareGet'
  APP_ID: 'io.github.vmwareget'

jobs:
  # ============================================================================
  # 1. macOS Build (.dmg & .zip) - arm64 & x64
  # ============================================================================
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build and Package macOS (${{ matrix.arch }})
        run: |
          chmod +x build.sh scripts/*.sh
          ./build.sh
          mkdir -p dist
          cp "VMwareGet-macos-${{ matrix.arch }}.dmg" "dist/VMwareGet-macos-${{ matrix.arch }}.dmg"
          cp "VMwareGet-macos-${{ matrix.arch }}.zip" "dist/VMwareGet-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/VMwareGet-macos-${{ matrix.arch }}.dmg
            dist/VMwareGet-macos-${{ matrix.arch }}.zip

  # ============================================================================
  # 2. Windows Build (.exe & .zip) - x64
  # ============================================================================
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Windows Release
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows Setup Installer (.exe & .zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $releasePath = "$PWD\build\windows\x64\runner\Release"
          if (-not (Test-Path $releasePath)) {
            $releasePath = "$PWD\build\windows\runner\Release"
          }
          $distPath = "$PWD\dist"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if (-not ($tagVersion -match '^\d+\.\d+')) {
            $tagVersion = "1.0.0"
          }

          $iconPath = "$PWD\windows\runner\resources\app_icon.ico"
          $baseName = "VMwareGet-windows-${{ matrix.arch }}-setup"
          Write-Host "Compiling Inno Setup installer: $baseName with version $tagVersion..."
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$tagVersion" "/DMyAppSourceDir=$releasePath" "/DMyAppOutputDir=$distPath" "/DMyAppIconFile=$iconPath" "/DMyOutputBaseFilename=$baseName" windows\installer\vmwareget.iss

          Write-Host "Creating Windows Portable ZIP archive..."
          Compress-Archive -Path "$releasePath\*" -DestinationPath "$distPath\VMwareGet-windows-${{ matrix.arch }}.zip" -Force

          Write-Host "Verifying generated Windows packages:"
          Get-ChildItem -Path dist\* | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/VMwareGet-windows-${{ matrix.arch }}-setup.exe
            dist/VMwareGet-windows-${{ matrix.arch }}.zip

  # ============================================================================
  # 3. Linux Debian-based Build (.deb & .tar.gz) - x64 & arm64
  # ============================================================================
  build-linux-deb:
    name: Build Linux Debian (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev dpkg-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package .deb and .tar.gz package
        run: |
          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/lib/${{ env.APP_NAME }}
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p dist

          # Copy compiled bundle
          cp -r build/linux/*/release/bundle/* deb-pkg/usr/lib/${{ env.APP_NAME }}/

          # Create wrapper launcher script
          cat << 'EOF' > deb-pkg/usr/bin/vmwareget
          #!/bin/bash
          exec /usr/lib/VMwareGet/vmwareget "$@"
          EOF
          chmod +x deb-pkg/usr/bin/vmwareget

          # Desktop file
          cat << EOF > deb-pkg/usr/share/applications/${{ env.APP_ID }}.desktop
          [Desktop Entry]
          Name=VMwareGet
          Comment=VMware Download & Account Companion App
          Exec=/usr/bin/vmwareget
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          # Control file
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          VERSION_TAG="${VERSION_TAG:-1.0.0}"
          cat << EOF > deb-pkg/DEBIAN/control
          Package: vmwareget
          Version: ${VERSION_TAG}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: VMwareGet Contributors <dev@vmwareget.internal>
          Description: VMware Download & Account Companion App (Cross-Platform)
           Streamlined interface for authenticating with Broadcom ecosystem and downloading
           installation packages for VMware Workstation Pro and Fusion with cryptographic verification.
          EOF

          dpkg-deb --build deb-pkg "dist/VMwareGet-linux-${{ matrix.arch }}.deb"
          tar -czf "dist/VMwareGet-linux-${{ matrix.arch }}.tar.gz" -C deb-pkg/usr/lib/${{ env.APP_NAME }} .

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.arch }}
          path: |
            dist/VMwareGet-linux-${{ matrix.arch }}.deb
            dist/VMwareGet-linux-${{ matrix.arch }}.tar.gz

  # ============================================================================
  # 4. Linux Fedora-based Build (.rpm) - x64 & arm64
  # ============================================================================
  build-linux-rpm:
    name: Build Linux Fedora (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            rpm_target: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rpm_target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build prerequisites and rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev rpm alien
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package .rpm package
        run: |
          mkdir -p dist
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          VERSION_TAG="${VERSION_TAG:-1.0.0}"

          # Structure RPM buildroot
          RPM_ROOT="$HOME/rpmbuild"
          mkdir -p "$RPM_ROOT"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/bin"
          mkdir -p "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/lib/${{ env.APP_NAME }}"
          mkdir -p "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/share/applications"

          cp -r build/linux/*/release/bundle/* "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/lib/${{ env.APP_NAME }}/"

          cat << 'EOF' > "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/bin/vmwareget"
          #!/bin/bash
          exec /usr/lib/VMwareGet/vmwareget "$@"
          EOF
          chmod +x "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/bin/vmwareget"

          cat << EOF > "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}/usr/share/applications/${{ env.APP_ID }}.desktop"
          [Desktop Entry]
          Name=VMwareGet
          Comment=VMware Download & Account Companion App
          Exec=/usr/bin/vmwareget
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          cat << EOF > "$RPM_ROOT/SPECS/vmwareget.spec"
          Name:           vmwareget
          Version:        ${VERSION_TAG}
          Release:        1%{?dist}
          Summary:        VMware Download & Account Companion App
          License:        MIT
          URL:            https://github.com/vmwareget/vmwareget

          %description
          VMware Download & Account Companion App (Cross-Platform)

          %files
          /usr/bin/vmwareget
          /usr/lib/${{ env.APP_NAME }}
          /usr/share/applications/${{ env.APP_ID }}.desktop
          EOF

          rpmbuild -bb --target ${{ matrix.rpm_target }} --buildroot "$RPM_ROOT/BUILDROOT/vmwareget-${VERSION_TAG}-1.${{ matrix.rpm_target }}" "$RPM_ROOT/SPECS/vmwareget.spec"
          find "$RPM_ROOT/RPMS" -name "*.rpm" -exec cp {} "dist/VMwareGet-linux-${{ matrix.arch }}.rpm" \;

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-rpm-${{ matrix.arch }}
          path: dist/VMwareGet-linux-${{ matrix.arch }}.rpm

  # ============================================================================
  # 5. Android Build (.apk) - arm64-v8a, x86_64, universal
  # ============================================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK (Per-ABI splits + Universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/VMwareGet-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/VMwareGet-android-x86_64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/VMwareGet-android-armeabi-v7a.apk" || true
          cp build/app/outputs/flutter-apk/app-release.apk "dist/VMwareGet-android-universal.apk"
          ls -lh dist/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk

  # ============================================================================
  # 6. Release Publisher
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux-deb, build-linux-rpm, build-android]
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: raw-artifacts

      - name: Collect and flatten release assets
        run: |
          mkdir -p release-dist
          echo "=== Collecting build artifacts ==="
          find raw-artifacts -type f -exec cp -v {} release-dist/ \;
          echo "=== Final Distribution Files ==="
          ls -lh release-dist/

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
