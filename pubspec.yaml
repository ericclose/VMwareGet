name: vmwareget
description: "VMware Download & Account Companion App (Cross-Platform)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: "3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  dio: ^5.7.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  crypto: ^3.0.6
  intl: ^0.20.3
  path: ^1.9.0
  shared_preferences: ^2.3.5
  desktop_webview_window:
    path: packages/desktop_webview_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
